<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry Form | Galla</title>
  <meta name="description" content="Submit your inquiry to Galla quickly and securely. All submissions are automatically recorded.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <main class="form-wrapper">
      <div class="form-card">
        <!-- Header Section -->
        <header class="card-header">
          <div class="brand-badge">
            <span class="status-indicator"></span>
            <span>Galla Inquiries</span>
          </div>
          <h1 class="card-title">Send an Inquiry</h1>
          <p class="card-subtitle">Fill out the details below and we will get back to you shortly.</p>
        </header>

        <!-- Status Message Banner -->
        <div id="statusAlert" class="status-alert hidden" role="alert" aria-live="polite">
          <div class="alert-icon" id="alertIcon"></div>
          <div class="alert-content">
            <h4 class="alert-title" id="alertTitle"></h4>
            <p class="alert-message" id="alertMessage"></p>
          </div>
          <button type="button" class="alert-dismiss" id="alertDismiss" aria-label="Dismiss alert">&times;</button>
        </div>

        <!-- Inquiry Form -->
        <form id="inquiryForm" class="inquiry-form" novalidate>
          <!-- Field 1: Name -->
          <div class="form-group">
            <label for="nameInput" class="form-label">
              <span>Name</span>
              <span class="required-star" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="nameInput" 
                name="name" 
                class="form-input" 
                placeholder="Enter your full name" 
                required 
                autocomplete="name"
              >
            </div>
            <span class="field-error" id="nameError">Please enter your name.</span>
          </div>

          <!-- Field 2: Mobile Number -->
          <div class="form-group">
            <div class="label-row">
              <label for="mobileInput" class="form-label">
                <span>Mobile Number</span>
                <span class="required-star" aria-hidden="true">*</span>
              </label>
              <span class="char-counter" id="mobileCounter">0/10</span>
            </div>
            <div class="input-wrapper mobile-wrapper">
              <div class="input-prefix" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </div>
              <input 
                type="tel" 
                id="mobileInput" 
                name="mobile" 
                class="form-input with-prefix" 
                placeholder="10-digit mobile number" 
                inputmode="numeric" 
                pattern="[0-9]{10}" 
                maxlength="10" 
                required 
                autocomplete="tel"
              >
            </div>
            <span class="field-error" id="mobileError">Mobile number must be exactly 10 digits.</span>
          </div>

          <!-- Field 3: Note -->
          <div class="form-group">
            <label for="noteInput" class="form-label">
              <span>Note</span>
              <span class="required-star" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <textarea 
                id="noteInput" 
                name="note" 
                class="form-textarea" 
                rows="4" 
                placeholder="Write your message or inquiry details here..." 
                required
              ></textarea>
            </div>
            <span class="field-error" id="noteError">Please enter your note.</span>
          </div>

          <!-- Action Buttons (Order: Send Inquiry, then View Submissions) -->
          <div class="form-actions">
            <!-- Button 1: Send Inquiry -->
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-text">Send Inquiry</span>
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>

            <!-- Button 2: View Submissions (Directly below Send Inquiry) -->
            <a href="#" id="viewSubmissionsBtn" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>View Submissions</span>
            </a>
          </div>
        </form>

        <!-- Footer Notice -->
        <footer class="card-footer">
          <p class="footer-text">
            Protected & synced automatically with Google Sheets
          </p>
        </footer>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
